<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>日常帳本</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日常帳本">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: phone-first ledger — home (hero balance, quick-category grid, donut + income cards, recent list), day-by-day detail page, settings page; bottom nav with a raised center add button */
:root{
  --a-l:#2374BA; --a-d:#3B8ED8; --h-l:#2374BA; --h-d:#2478BD;
  --bg:#FFFFFF; --surface:#F6F8F7; --surface2:#ECEFEE; --ink:#15191A; --muted:#6A736F; --line:#E0E5E3;
  --accent:var(--a-l); --accent-ink:#FFFFFF; --hero:var(--h-l); --hero-ink:#FFFFFF; --hero-sub:rgba(255,255,255,.78);
  --danger:#C8423A; --danger-soft:#F7E1DF;
  --c1:#E0874F; --c2:#4F86C6; --c3:#C9A13B; --c4:#8E6CC2; --c5:#3E9A6A; --c6:#CF5F8C; --c7:#6D8796; --c8:#9A7656; --c9:#3EA3A3; --c10:#9AA046; --c11:#5A6FD1; --c12:#B5584A;
  --f:"Microsoft JhengHei","微軟正黑體","Noto Sans TC","PingFang TC",-apple-system,sans-serif;
  --r:18px; --shadow:0 8px 24px rgba(15,25,22,.12);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --surface2:#2C2C2E; --ink:#FFFFFF; --muted:#8E8E93; --line:#38383A;
  --accent:var(--a-d); --accent-ink:#FFFFFF; --hero:var(--h-d); --hero-ink:#FFFFFF; --hero-sub:rgba(255,255,255,.78);
  --danger:#E5675C; --danger-soft:#3D2220;
  --c1:#E8925A; --c2:#5D93D1; --c3:#D8B04C; --c4:#A383D6; --c5:#56B282; --c6:#DE75A0; --c7:#8EA6B4; --c8:#B98F6B; --c9:#5BBDBD; --c10:#B3B95E; --c11:#7E90E6; --c12:#D9776A;
  --shadow:0 8px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --surface2:#2C2C2E; --ink:#FFFFFF; --muted:#8E8E93; --line:#38383A;
  --accent:var(--a-d); --accent-ink:#FFFFFF; --hero:var(--h-d); --hero-ink:#FFFFFF; --hero-sub:rgba(255,255,255,.78);
  --danger:#E5675C; --danger-soft:#3D2220;
  --c1:#E8925A; --c2:#5D93D1; --c3:#D8B04C; --c4:#A383D6; --c5:#56B282; --c6:#DE75A0; --c7:#8EA6B4; --c8:#B98F6B; --c9:#5BBDBD; --c10:#B3B95E; --c11:#7E90E6; --c12:#D9776A;
  --shadow:0 8px 24px rgba(0,0,0,.45); color-scheme:dark}

/* user-chosen background (overrides system/host theme) */
:root[data-bg="light"]{
  --bg:#FFFFFF; --surface:#F6F8F7; --surface2:#ECEFEE; --ink:#15191A; --muted:#6A736F; --line:#E0E5E3;
  --accent:var(--a-l); --accent-ink:#FFFFFF; --hero:var(--h-l); --hero-ink:#FFFFFF; --hero-sub:rgba(255,255,255,.78);
  --danger:#C8423A; --danger-soft:#F7E1DF;
  --c1:#E0874F; --c2:#4F86C6; --c3:#C9A13B; --c4:#8E6CC2; --c5:#3E9A6A; --c6:#CF5F8C; --c7:#6D8796; --c8:#9A7656; --c9:#3EA3A3; --c10:#9AA046; --c11:#5A6FD1; --c12:#B5584A;
  --shadow:0 8px 24px rgba(15,25,22,.12); color-scheme:light}
:root[data-bg="dark"]{
  --bg:#000000; --surface:#1C1C1E; --surface2:#2C2C2E; --ink:#FFFFFF; --muted:#8E8E93; --line:#38383A;
  --accent:var(--a-d); --accent-ink:#FFFFFF; --hero:var(--h-d); --hero-ink:#FFFFFF; --hero-sub:rgba(255,255,255,.78);
  --danger:#E5675C; --danger-soft:#3D2220;
  --c1:#E8925A; --c2:#5D93D1; --c3:#D8B04C; --c4:#A383D6; --c5:#56B282; --c6:#DE75A0; --c7:#8EA6B4; --c8:#B98F6B; --c9:#5BBDBD; --c10:#B3B95E; --c11:#7E90E6; --c12:#D9776A;
  --shadow:0 8px 24px rgba(0,0,0,.45); color-scheme:dark}
/* theme colors: light-mode accent, dark-mode accent, light hero, dark hero */
:root[data-accent="green"]{--a-l:#1F8A5B; --a-d:#3DB27A; --h-l:#1F8A5B; --h-d:#22825A}
:root[data-accent="teal"]{--a-l:#0E7C86; --a-d:#36B0BA; --h-l:#0E7C86; --h-d:#12737C}
:root[data-accent="purple"]{--a-l:#6B4FBF; --a-d:#9479E0; --h-l:#6B4FBF; --h-d:#6A50B8}
:root[data-accent="pink"]{--a-l:#C43F77; --a-d:#E8709E; --h-l:#CC4880; --h-d:#B54072}
:root[data-accent="orange"]{--a-l:#C85E1C; --a-d:#F08A45; --h-l:#D2662A; --h-d:#BF5D1E}

/* liquid glass tokens */
:root{--glass-bg:rgba(250,250,252,.58);--glass-line:rgba(255,255,255,.8);--glass-edge:rgba(0,0,0,.06);--glass-hi:rgba(255,255,255,.95);--glass-sheen:rgba(255,255,255,.55);--glass-glow:rgba(255,255,255,.35);--glass-drop:rgba(20,30,40,.14);--glass-pill:rgba(255,255,255,.7);--sheet-bg:rgba(248,248,250,.74);--scrim:rgba(0,0,0,.18)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass-bg:rgba(44,44,48,.5);--glass-line:rgba(255,255,255,.14);--glass-edge:rgba(0,0,0,.6);--glass-hi:rgba(255,255,255,.22);--glass-sheen:rgba(255,255,255,.12);--glass-glow:rgba(255,255,255,.06);--glass-drop:rgba(0,0,0,.55);--glass-pill:rgba(255,255,255,.12);--sheet-bg:rgba(28,28,30,.66);--scrim:rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--glass-bg:rgba(44,44,48,.5);--glass-line:rgba(255,255,255,.14);--glass-edge:rgba(0,0,0,.6);--glass-hi:rgba(255,255,255,.22);--glass-sheen:rgba(255,255,255,.12);--glass-glow:rgba(255,255,255,.06);--glass-drop:rgba(0,0,0,.55);--glass-pill:rgba(255,255,255,.12);--sheet-bg:rgba(28,28,30,.66);--scrim:rgba(0,0,0,.35)}
:root[data-bg="light"]{--glass-bg:rgba(250,250,252,.58);--glass-line:rgba(255,255,255,.8);--glass-edge:rgba(0,0,0,.06);--glass-hi:rgba(255,255,255,.95);--glass-sheen:rgba(255,255,255,.55);--glass-glow:rgba(255,255,255,.35);--glass-drop:rgba(20,30,40,.14);--glass-pill:rgba(255,255,255,.7);--sheet-bg:rgba(248,248,250,.74);--scrim:rgba(0,0,0,.18)}
:root[data-bg="dark"]{--glass-bg:rgba(44,44,48,.5);--glass-line:rgba(255,255,255,.14);--glass-edge:rgba(0,0,0,.6);--glass-hi:rgba(255,255,255,.22);--glass-sheen:rgba(255,255,255,.12);--glass-glow:rgba(255,255,255,.06);--glass-drop:rgba(0,0,0,.55);--glass-pill:rgba(255,255,255,.12);--sheet-bg:rgba(28,28,30,.66);--scrim:rgba(0,0,0,.35)}

[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tn{font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));overflow-x:clip}
main .wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;padding-block:6px 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;overflow:hidden}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.card-h h2,.sec-h h2{margin:0;font-size:16px;font-weight:700}
.card-h span,.sec-h span{font-size:12.5px;color:var(--muted)}

/* app bar */
.appbar .wrap{display:flex;justify-content:space-between;align-items:center;padding-block:14px 8px}
.appbar small{display:block;font-size:13px;color:var(--muted)}
.appbar h1{margin:0;font-size:28px;font-weight:900;letter-spacing:.02em;line-height:1.25}
.round{width:42px;height:42px;border-radius:50%;border:0;background:var(--surface2);display:grid;place-items:center;color:var(--ink)}
.round svg{width:22px;height:22px}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:20px 22px 22px;display:grid;gap:6px;box-shadow:var(--shadow)}
.hero .lbl{font-size:14px;color:var(--hero-sub)}
.hero .big{font-size:44px;font-weight:900;line-height:1.1;letter-spacing:.01em;overflow-wrap:anywhere}
.hero .sub{font-size:13.5px;font-weight:500;margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 10px}
.hero .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:6px}
.hero .bar div{height:100%;background:#fff;border-radius:3px}
.hero.over .bar div{background:#FFC2BA}

/* quick grid */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:-6px}
.qgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.qbtn{background:var(--surface);border:1px solid var(--line);border-radius:16px;min-height:80px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14.5px;min-width:0}
.qdot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:700;line-height:1}
.qbtn .dots{font-size:20px;letter-spacing:.35em;line-height:1;margin-right:-.35em}
.qbtn span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qbtn:active{transform:scale(.97);background:var(--surface2)}

/* duo */
.duo{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px}
@media (max-width:560px){.duo{grid-template-columns:minmax(0,1fr)}}
.donutrow{display:grid;grid-template-columns:100px minmax(0,1fr);gap:14px;align-items:center}
.donutrow svg{width:100px;height:100px}
.legend{display:grid;gap:7px;min-width:0}
.lg{display:grid;grid-template-columns:9px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}
.lg i{width:9px;height:9px;border-radius:50%}
.lg b{font-weight:700}
.lg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.incbig{font-size:30px;font-weight:900;color:var(--accent);line-height:1.2;margin-top:6px;overflow-wrap:anywhere}
.incsub{font-size:13.5px;color:var(--muted);margin-top:6px}

/* entry rows */
.rows{display:grid}
.sw-wrap{position:relative;overflow:hidden;border-top:1px solid var(--line);margin-inline:-16px}
.rows .sw-wrap:first-child{border-top:0}
.row{position:relative;z-index:1;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;background:var(--surface);transition:transform .22s ease;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.act{position:absolute;top:0;bottom:0;display:flex;align-items:center;font-weight:700;font-size:15px;color:#fff;border:0;opacity:0}
.act-edit{left:0;right:0;justify-content:flex-start;padding-left:22px;background:var(--accent)}
.act-del{right:0;left:0;justify-content:flex-end;padding-right:22px;background:var(--danger)}
.sw-wrap.r .act-edit,.sw-wrap.l .act-del{opacity:.55}
.sw-wrap.armed-edit .act-edit,.sw-wrap.armed-del .act-del{opacity:1}
.sw-wrap.armed-del .act-del,.sw-wrap.armed-edit .act-edit{font-size:16px}
.swipehint{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.tile{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:17px;font-weight:700;color:#fff}
.row .main{min-width:0;text-align:left;background:none;border:0;padding:0;-webkit-touch-callout:none}
.row .main b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .main span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-size:16.5px;font-weight:700;white-space:nowrap}
.amt.inc{color:var(--accent)}
.more{margin-top:6px;width:100%;border:0;background:var(--surface2);border-radius:12px;padding:10px;font-weight:700;font-size:14px;color:var(--accent)}
.card-h .today{font-size:16px;font-weight:700;color:var(--ink)}.today em{font-style:normal;color:var(--accent);margin-right:6px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px dashed var(--accent);border-radius:14px;padding:10px 12px;font-size:13.5px}
.banner button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:6px 12px;font-size:13px;font-weight:700}
.emptyline{color:var(--muted);font-size:14px;padding:6px 0}

/* detail page */
.monthbar{display:flex;align-items:center;justify-content:space-between}
.monthbar h2{margin:0;font-size:20px;font-weight:900}
.monthbar h2 small{font-size:13px;color:var(--muted);font-weight:500;margin-left:6px}
.sums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sums div{display:grid;gap:2px}
.sums span{font-size:12px;color:var(--muted)}
.sums b{font-size:18px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sums .inc b{color:var(--accent)}
.sums .neg b{color:var(--danger)}
.day .card-h{margin-bottom:6px}
.day .card-h h2{font-size:15px}
.day .card-h h2 small{font-weight:500;color:var(--muted);margin-left:6px;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}

/* settings */
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--accent);font-weight:700;padding:4px 0;font-size:15px}
.field{display:grid;gap:6px}
.field label{font-size:13px;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:16px}
.inp:focus{border-color:var(--accent);outline:none}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 11px;font-size:14px;background:var(--surface2)}
.tag .cdot{width:18px;height:18px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0;margin-left:-4px}
.tag button[data-tdel],.tag button[data-fdel]{border:0;background:transparent;color:var(--muted);width:22px;height:22px;border-radius:50%;font-size:15px;line-height:1}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow .inp{flex:1;min-width:0;padding:8px 12px;font-size:15px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:700;font-size:14.5px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.swatches{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:400px){.swatches{grid-template-columns:repeat(3,minmax(0,1fr))}}
.sw{border:2px solid transparent;background:var(--surface2);border-radius:14px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:700;min-width:0}
.sw i{width:30px;height:30px;border-radius:50%;display:block}
.sw[aria-pressed="true"]{border-color:var(--accent)}
.bgseg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface2);border-radius:12px;padding:3px}
.bgseg button{border:0;background:transparent;padding:8px 4px;border-radius:9px;font-weight:700;color:var(--muted);font-size:14px}
.bgseg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.sublbl{font-size:13px;color:var(--muted);margin:14px 0 8px}
.card-h + .sublbl{margin-top:0}
.note{font-size:13px;color:var(--muted);margin:0 0 12px}
textarea.inp{font-size:12px;min-height:140px;margin-top:10px}

/* bottom nav */
.bottom{position:fixed;z-index:6;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
.bottom .wrap{pointer-events:auto;position:relative;display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;gap:4px;max-width:340px;height:62px;padding:6px;border-radius:31px;
  background:var(--glass-bg);-webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);
  border:1px solid var(--glass-line);
  box-shadow:0 12px 32px var(--glass-drop),0 2px 6px var(--glass-drop),inset 0 1px 0 var(--glass-hi),inset 0 -1px 0 var(--glass-edge)}
.bottom .wrap::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,var(--glass-sheen) 0%,transparent 48%),radial-gradient(120% 90% at 50% 120%,var(--glass-glow),transparent 60%)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.bottom .wrap{background:var(--surface)}}
.nav{position:relative;border:0;background:none;font-size:14.5px;font-weight:700;color:var(--muted);height:100%;border-radius:25px;transition:background .2s,color .2s}
.nav[aria-current="page"]{color:var(--accent);background:var(--glass-pill);box-shadow:inset 0 1px 0 var(--glass-hi)}
.add{position:relative;width:50px;height:50px;border-radius:50%;border:0;color:var(--accent-ink);display:grid;place-items:center;justify-self:center;
  background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0) 55%),var(--accent);
  box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 45%,transparent),inset 0 1px 1px rgba(255,255,255,.65),inset 0 -2px 4px rgba(0,0,0,.18);transition:transform .15s}
.add svg{width:26px;height:26px}
.add:active{transform:scale(.92)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(5,10,8,.5)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:92%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet .wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding-block:18px 4px;max-width:560px}
.sheethead{display:flex;justify-content:space-between;align-items:center}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 20px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg button[data-type="inc"][aria-pressed="true"]{color:var(--accent)}
.amountbox{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:4px;min-width:0}
.amountbox span{color:var(--muted);font-size:22px;font-weight:700}

.amounthint{font-size:12px;color:var(--muted);text-align:right;margin-top:-8px;min-height:1em}

.picks{display:flex;flex-wrap:wrap;gap:7px}
.pick{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:6px 12px;font-size:14.5px;display:inline-flex;gap:5px;align-items:center}
.pick .pdot{width:9px;height:9px;border-radius:50%;display:inline-block}

.pick[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.actions .right{margin-left:auto}

.confirm{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--danger);flex-wrap:wrap}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}

/* liquid glass: settings / back button */
#gear{position:relative;overflow:hidden;background:var(--glass-bg);-webkit-backdrop-filter:blur(18px) saturate(190%);backdrop-filter:blur(18px) saturate(190%);border:1px solid var(--glass-line);
  box-shadow:0 6px 18px var(--glass-drop),inset 0 1px 0 var(--glass-hi),inset 0 -1px 0 var(--glass-edge);transition:transform .15s}
#gear::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(160deg,var(--glass-sheen) 0%,transparent 55%)}
#gear:active{transform:scale(.92)}
#gear #gearIc{position:relative}
/* liquid glass: entry sheet */
.scrim{background:var(--scrim)}
.sheet{background:var(--sheet-bg);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);border-top:1px solid var(--glass-line);
  box-shadow:0 -10px 40px var(--glass-drop),inset 0 1px 0 var(--glass-hi)}
.sheet .wrap::before{content:"";justify-self:center;width:38px;height:5px;border-radius:3px;background:var(--muted);opacity:.45;margin:-8px 0 -4px}
.sheet .inp,.sheet .pick,.sheet .seg{background:var(--glass-pill);border-color:var(--glass-line)}
.sheet .pick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.sheet .seg button[aria-pressed="true"]{background:var(--bg)}
.sheet .round{background:var(--glass-pill);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--glass-hi)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){#gear{background:var(--surface2)}.sheet{background:var(--surface)}}

/* centered entry dialog */
.sheet{left:50%;right:auto;top:50%;bottom:auto;width:min(420px,calc(100% - 32px));max-height:calc(100% - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  transform:translate(-50%,-50%);border-radius:26px;border:1px solid var(--glass-line);padding:20px 20px 18px;animation:none;
  display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}

.mhead{display:flex;justify-content:space-between;align-items:center}

.sheet .seg button[aria-pressed="true"]{background:var(--surface2);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.sheet .seg button[data-type="inc"][aria-pressed="true"]{color:var(--accent)}
.fld{display:grid;gap:7px}
.fl{font-size:14px;font-weight:700}
.fbox{position:relative;display:flex;align-items:center;gap:8px;min-height:50px;padding:0 14px;border-radius:14px;background:var(--glass-pill);border:1.5px solid var(--glass-line);transition:border-color .15s,box-shadow .15s}
.fbox:focus-within{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 10%,transparent)}
.fbox input,.fbox select{flex:1;min-width:0;width:100%;border:0;background:transparent;outline:none;font-size:16.5px;font-weight:700;padding:12px 0;-webkit-appearance:none;appearance:none}
.fbox input::placeholder{color:var(--muted);font-weight:500}
.fbox.amt .cur{color:var(--muted);font-weight:700;font-size:17px}
.fbox.amt input{font-size:20px;font-variant-numeric:tabular-nums}
.fbox.amt.inc input{color:var(--accent)}
.fbox.sel select{padding-right:26px;cursor:pointer}
.fbox .chev{position:absolute;right:14px;width:18px;height:18px;color:var(--muted);pointer-events:none}
.seldot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 0%,transparent)}

.amounthint{margin:0;min-height:0;text-align:right;font-size:12.5px;color:var(--muted)}
.amounthint:empty{display:none}
.savebtn{margin-top:4px;border:0;border-radius:16px;min-height:52px;font-size:17px;font-weight:900;color:var(--accent-ink);
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 60%),var(--accent);box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 35%,transparent),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .12s}
.savebtn:active{transform:scale(.98)}
.delslot:empty{display:none}
.delslot{display:flex;justify-content:center}
.linkdel{border:0;background:none;color:var(--danger);font-weight:700;font-size:14.5px;padding:4px 8px}
/* animation */
@keyframes popIn{from{opacity:0;transform:translate(-50%,-44%) scale(.9)}60%{opacity:1}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes popOut{to{opacity:0;transform:translate(-50%,-47%) scale(.94)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}}@keyframes fadeOut{to{opacity:0}}
.sheet.show{animation:popIn .42s cubic-bezier(.2,1.1,.3,1) both}
.sheet.show>*{animation:rise .38s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(60ms + var(--i,0) * 32ms)}
.sheet.hide{animation:popOut .19s ease-in both}
.scrim:not([hidden]){animation:fadeIn .25s ease both}
.scrim.hide{animation:fadeOut .19s ease-in both}
@media (prefers-reduced-motion:reduce){.sheet.show,.sheet.show>*,.sheet.hide,.scrim:not([hidden]),.scrim.hide{animation:none}}

/* custom dropdowns */
.ddbtn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:12px 26px 12px 0;font-size:16.5px;font-weight:700;text-align:left;outline:none}

.fld.ddopen{position:relative;z-index:5}

  background:var(--surface);border:1px solid var(--line);box-shadow:0 16px 40px var(--glass-drop),0 2px 8px var(--glass-drop);transform-origin:top center;animation:ddIn .16s cubic-bezier(.2,.9,.3,1)}

/* wheel picker */
.wheelwrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s cubic-bezier(.2,.9,.3,1),margin .32s;margin-top:-7px}
.wheelwrap>div{min-height:0;overflow:hidden}
.wheelwrap.open{grid-template-rows:1fr;margin-top:2px}
.wheel{position:relative;display:flex;height:180px;padding:0 6px;border-radius:14px;background:var(--glass-pill);border:1.5px solid var(--glass-line);perspective:700px}
.wheel::before{content:"";position:absolute;left:6px;right:6px;top:50%;height:36px;transform:translateY(-50%);border-radius:10px;background:var(--surface2);pointer-events:none}
.wcol{position:relative;flex:1;min-width:0;height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;padding:72px 0;scrollbar-width:none;overscroll-behavior:contain;
  -webkit-mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent);mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent);transform-style:preserve-3d}
.wcol::-webkit-scrollbar{display:none}
.wcol.date{flex:2.6}.wcol.ap{flex:1.1}.wcol.hr,.wcol.mi{flex:.9}
.wi{height:36px;line-height:36px;text-align:center;scroll-snap-align:center;font-size:17px;font-weight:500;color:var(--muted);white-space:nowrap;cursor:pointer;backface-visibility:hidden;font-variant-numeric:tabular-nums}

@media (max-width:380px){.wi{font-size:15.5px}.wcol.date .wi{font-size:14.5px}}
@media (prefers-reduced-motion:reduce){.wheelwrap{transition:none}}
#fWhenBtn[aria-expanded="true"]~.chev{transform:rotate(180deg)}

/* white/dark background: make native scrollbars follow the chosen background */
:root[data-bg="light"] body{color-scheme:light}

.ddlist,.sheet{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--muted) 45%,transparent) transparent}

@media (prefers-reduced-motion:reduce){main .wrap.go-fwd>section>*,main .wrap.go-back>section>*,main .wrap.go-fwd>#bannerSlot,main .wrap.go-back>#bannerSlot,#gearIc.morph{animation:none}.navpill{transition:none}}

/* background stays put while the dialog is open */

.bmain{min-width:0}
.btop{display:flex;align-items:center;gap:8px}
.btop>b{font-size:15px;white-space:nowrap}
.btop>span{font-size:13px;color:var(--muted);white-space:nowrap}
.bnote{font-size:12px;color:var(--muted);margin-top:4px;font-weight:700}
.brow.warn .bnote{color:#B9770E}
.brow.over .bnote{color:var(--danger)}
.recs{display:grid}
.rec{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:11px 0}
.rec:first-child{border-top:0;padding-top:0}
.rec .rmain b{font-size:15.5px}
.rec .rmain span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recs+.more{margin-top:12px}
/* recurring dialog */
.two2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.rhint{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
.sheet .rstart{margin-top:2px}
select option{background:var(--surface);color:var(--ink)}
.nsel{flex:1;min-width:0;width:100%;border:0;background:transparent;outline:none;font-size:16.5px;font-weight:700;padding:12px 26px 12px 0;-webkit-appearance:none;appearance:none;cursor:pointer}
@media (max-width:360px){.bigrow b{font-size:17px}.nav{font-size:13px}}

/* reminders */
.howto{margin-top:12px;font-size:14px}
.howto summary{cursor:pointer;color:var(--accent);font-weight:700;list-style:none}
.howto summary::-webkit-details-marker{display:none}
.howto summary::after{content:" ›";display:inline-block;transition:transform .2s}
.howto[open] summary::after{transform:rotate(90deg)}
.howto ol{margin:10px 0 0;padding-left:20px;display:grid;gap:6px;color:var(--ink)}
.rems{display:grid;gap:8px;margin-top:-6px}
.rem{display:flex;align-items:center;gap:10px;padding:10px 8px 10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:700;transition:opacity .2s,transform .2s;animation:remIn .35s cubic-bezier(.2,.9,.3,1) both}
@keyframes remIn{from{opacity:0;transform:translateY(-6px)}}
.rem.gone{opacity:0;transform:translateX(30px)}
.rem>i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--accent)}
.rem.warn>i{background:#E0A030}.rem.bad>i{background:var(--danger)}
.rem.bad{border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
.rtxt{flex:1;min-width:0}
.ract{border:0;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font-weight:700;font-size:13px;border-radius:999px;padding:6px 11px;white-space:nowrap}
.rx{width:30px;height:30px;border:0;background:none;color:var(--muted);display:grid;place-items:center;border-radius:50%;flex:none}
.rx svg{width:16px;height:16px}
@media (prefers-reduced-motion:reduce){.rem{animation:none;transition:none}}
.remrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fbox.sm{min-height:42px;flex:1 1 150px;background:var(--surface2);border-color:var(--line)}
.fbox.sm .nsel{padding:9px 26px 9px 0;font-size:15.5px}
.remrow .btn{min-height:42px}
.tgls{display:grid}
.tgl{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.tgl:first-child{border-top:0;padding-top:2px}
.tgl>span{flex:1;min-width:0;display:grid;gap:1px}
.tgl b{font-size:15px}.tgl small{font-size:12.5px;color:var(--muted)}
.tgl input{position:absolute;opacity:0;width:1px;height:1px}
.tgl>i{position:relative;width:50px;height:30px;border-radius:15px;background:var(--surface2);border:1px solid var(--line);flex:none;transition:background .2s}
.tgl>i::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.3,1.3,.5,1)}
.tgl input:checked+i{background:#34C759;border-color:#34C759}
.tgl input:checked+i::after{transform:translateX(20px)}
.tgl input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
</style>

    <div class="wheelwrap" id="wheelWrap"><div><div class="wheel" id="wheel" aria-label="選擇日期與時間"><div class="wcol date" id="wD"></div><div class="wcol ap" id="wAP"></div><div class="wcol hr" id="wH"></div><div class="wcol mi" id="wM"></div></div></div></div></div>
  <label class="favchk" id="favRow"><input type="checkbox" id="fFav"><span class="box"></span><span>同時存成常用項目，下次一鍵記帳</span></label>

<script>
(function(){
const DEFAULTS={budget:20000,exp:["餐飲","交通","購物","娛樂","居家","醫療","學習","其他"],inc:["薪水","獎金","投資","副業","其他"],accounts:["現金","信用卡","一卡通","銀行"]};
const S={tx:[],settings:clone(DEFAULTS),month:ym(new Date()),view:"home",sample:false};
const $=s=>document.querySelector(s);
function clone(o){return JSON.parse(JSON.stringify(o))}
function pad(n){return String(n).padStart(2,"0")}
function ym(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)}
function ymd(d){return ym(d)+"-"+pad(d.getDate())}
function fmt(n){return Math.round(n).toLocaleString("zh-TW")}
function money(n,sign){const s=sign&&n>0?"+":n<0?"−":"";return s+"$"+fmt(Math.abs(n))}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
const WD="日一二三四五六";
const NCOL=12;
function ckey(type,cat){return(type==="inc"?"inc:":"exp:")+cat}
function ensureColors(){const c=S.settings.colors=S.settings.colors||{};
  for(const type of["exp","inc"]){S.settings[type].forEach((cat,i)=>{const k=ckey(type,cat);if(c[k]==null){const used=S.settings[type].map(x=>c[ckey(type,x)]).filter(x=>x!=null);let pick=(i+(type==="inc"?4:0))%NCOL;for(let j=0;j<NCOL;j++){const cand=(pick+j)%NCOL;if(!used.includes(cand)){pick=cand;break}}c[k]=pick}})}}
function catColor(type,cat){const c=S.settings.colors||{};const v=c[ckey(type,cat)];return v==null?"var(--muted)":`var(--c${v+1})`}
function badge(type,cat,cls){return`<span class="${cls||"tile"}" style="background:${catColor(type,cat)}">${esc((cat||"?").slice(0,1))}</span>`}
function timeOf(t){if(!t.ts||t.ts<1e12)return"";const d=new Date(t.ts);const h=d.getHours();return(h<12?"上午":"下午")+pad(h%12||12)+":"+pad(d.getMinutes())}
function toast(msg,action){const t=$("#toast");t.textContent=msg;if(action){const b=document.createElement("button");b.type="button";b.textContent=action.label;b.onclick=()=>{t.hidden=true;action.fn()};t.appendChild(b)}t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,action?4500:2400)}

/* storage (same format as before, so existing data carries over) */
const LS_KEY="pocket-ledger-v1";
function lsLoad(){try{const r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):null}catch(e){return null}}
function lsSave(){try{localStorage.setItem(LS_KEY+"-look",JSON.stringify({accent:S.settings.accent,bg:S.settings.bg}))}catch(e){}if(S.sample)return;try{localStorage.setItem(LS_KEY,JSON.stringify({tx:S.tx,settings:S.settings}))}catch(e){}}
function sampleData(){
  const now=new Date(),out=[];
  const items=[["餐飲","早餐蛋餅",55,"現金",8],["餐飲","午餐便當",95,"現金",12],["餐飲","晚餐牛肉麵",160,"信用卡",19],["餐飲","手搖飲",65,"一卡通",15],["交通","捷運",35,"一卡通",9],["交通","加油",420,"信用卡",18],["購物","全聯日用品",386,"信用卡",20],["娛樂","電影票",310,"信用卡",21],["居家","電費",880,"銀行",10],["學習","線上課程",590,"信用卡",22]];
  const fac=[.92,1.12,.97,1.25,.88,1];
  for(let back=5;back>=0;back--){const base=new Date(now.getFullYear(),now.getMonth()-back,1),y=base.getFullYear(),m=base.getMonth(),last=back?new Date(y,m+1,0).getDate():now.getDate(),f=fac[5-back];
    for(let d=1;d<=last;d++){const n=1+((d+back)%3);for(let k=0;k<n;k++){const it=items[(d*3+k*7+back*2)%items.length];const ts=new Date(y,m,d,it[4],(d*7+k*13)%60).getTime();if(ts>Date.now())continue;
      out.push({id:uid(),type:"exp",cat:it[0],note:it[1],amount:Math.round(it[2]*(it[2]>300?f:1)),acct:it[3],date:`${y}-${pad(m+1)}-${pad(d)}`,ts})}}
    if(back||now.getDate()>=5)out.push({id:uid(),type:"inc",cat:"薪水",note:`${m+1}月薪資`,amount:42000,acct:"銀行",date:`${y}-${pad(m+1)}-05`,ts:new Date(y,m,5,9,30).getTime()});}
  return out;
}
function demoSettings(){const cur=ym(new Date());
  Object.assign(S.settings,{_demo:true,budget:36000,catBudget:{"餐飲":6500,"交通":2500,"購物":3000,"娛樂":2500},
    favs:[{id:"f1",type:"exp",name:"早餐蛋餅",cat:"餐飲",acct:"現金",amount:55},{id:"f2",type:"exp",name:"捷運",cat:"交通",acct:"一卡通",amount:35},{id:"f3",type:"exp",name:"手搖飲",cat:"餐飲",acct:"一卡通",amount:65},{id:"f4",type:"exp",name:"午餐便當",cat:"餐飲",acct:"現金",amount:95}],
    recurring:[{id:"r1",type:"exp",name:"房租",amount:12000,cat:"居家",acct:"銀行",day:1,next:shiftMonth(cur,-5)},{id:"r2",type:"exp",name:"Netflix",amount:390,cat:"娛樂",acct:"信用卡",day:15,next:shiftMonth(cur,-5)}]})}
function init(){const saved=lsLoad();if(saved&&saved.tx){S.tx=saved.tx;S.settings={...clone(DEFAULTS),...saved.settings}}else{S.tx=sampleData();S.sample=true;demoSettings();try{const lk=JSON.parse(localStorage.getItem(LS_KEY+"-look")||"null");if(lk)Object.assign(S.settings,lk)}catch(e){}}ensureColors();applyLook();const nr=runRecurring();render();if(nr&&!S.sample)toast(`已自動記入 ${nr} 筆固定收支`)}
function putTx(t){const i=S.tx.findIndex(x=>x.id===t.id);if(i>=0)S.tx[i]=t;else S.tx.push(t);lsSave();render()}
function delTx(id){const t=S.tx.find(x=>x.id===id);S.tx=S.tx.filter(x=>x.id!==id);lsSave();render();return t}
function saveSettings(){lsSave();render()}
function exitSample(){if(!S.sample)return;S.tx=[];S.sample=false;if(S.settings._demo){delete S.settings._demo;S.settings.budget=DEFAULTS.budget;S.settings.catBudget={};S.settings.favs=[];S.settings.recurring=[]}}
function clearSample(){exitSample();lsSave();render();toast("已清除範例，開始記帳吧")}

/* derived */
function monthTx(m){return S.tx.filter(t=>t.date&&t.date.slice(0,7)===m)}
function totals(l){let e=0,i=0;for(const t of l){if(t.type==="inc")i+=+t.amount||0;else e+=+t.amount||0}return{e,i,n:i-e}}
function shiftMonth(m,d){const[y,mm]=m.split("-").map(Number);return ym(new Date(y,mm-1+d,1))}
function sortDesc(l){return l.sort((a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0))}
function recentCats(){const seen=[];for(const t of sortDesc(S.tx.filter(x=>x.type!=="inc"))){if(!seen.includes(t.cat)&&S.settings.exp.includes(t.cat))seen.push(t.cat);if(seen.length>=5)break}for(const c of S.settings.exp){if(seen.length>=5)break;if(!seen.includes(c))seen.push(c)}return seen}

/* render */
function movePill(){const p=document.querySelector(".navpill"),a=document.querySelector('.nav[aria-current="page"]');if(!p)return;
  if(!a){p.style.opacity="0";return}p.style.opacity="1";p.style.setProperty("--px",a.offsetLeft+"px");p.style.setProperty("--pw",a.offsetWidth+"px")}
window.addEventListener("resize",()=>{const p=document.querySelector(".navpill");if(p){p.style.transition="none";movePill();requestAnimationFrame(()=>p.style.transition="")}});
function render(){
  const now=new Date();$("#ymLabel").textContent=`${now.getFullYear()}年${now.getMonth()+1}月`;
  $("#bannerSlot").innerHTML=S.sample&&S.view!=="set"?`<div class="banner"><span>目前顯示的是<b>範例資料</b>。</span><button id="clr">清除範例，開始記帳</button></div>`:"";
  if(S.sample&&S.view!=="set")$("#clr").onclick=clearSample;

function bindSwipe(wrap){
  const row=wrap.querySelector(".row"),OPEN=88;let x0=0,y0=0,base=0,dx=0,state="idle",pid=null;
  row.addEventListener("pointerdown",e=>{if(e.button>0)return;x0=e.clientX;y0=e.clientY;base=wrap.classList.contains("open")?-OPEN:0;dx=0;state="maybe";pid=e.pointerId});
  row.addEventListener("pointermove",e=>{
    if(e.pointerId!==pid)return;const mx=e.clientX-x0,my=e.clientY-y0;
    if(state==="maybe"){if(Math.abs(my)>10&&Math.abs(my)>Math.abs(mx)){state="idle";return}if(Math.abs(mx)>10){state="drag";closeOpen(wrap);try{row.setPointerCapture(pid)}catch(_){}row.style.transition="none"}}
    if(state!=="drag")return;
    const w=wrap.offsetWidth;let x=base+mx;x=Math.max(-w,Math.min(w*.85,x));dx=x;
    row.style.transform=`translateX(${x}px)`;wrap.classList.toggle("l",x<0);wrap.classList.toggle("r",x>0);
    wrap.classList.toggle("armed-del",x<-w*.5);wrap.classList.toggle("armed-edit",x>w*.5);
  });
  const end=e=>{
    if(e.pointerId!==pid)return;pid=null;
    if(state!=="drag"){state="idle";return}
    state="idle";justSwiped=true;setTimeout(()=>justSwiped=false,60);
    const w=wrap.offsetWidth,id=wrap.dataset.id;row.style.transition="";wrap.classList.remove("armed-del","armed-edit");

    row.style.transform="";wrap.classList.remove("open");
    setTimeout(()=>wrap.classList.remove("l","r"),200);
    if(dx>w*.5)openSheet({edit:S.tx.find(x=>x.id===id)});
  };
  row.addEventListener("pointerup",end);row.addEventListener("pointercancel",end);
}

const IH=36,PAST=730,FUTURE=90;let dateBase=null,wheelBuilt=false;

  const dl=diff===0?"今天":diff===-1?"昨天":`${d.getFullYear()!==t.getFullYear()?d.getFullYear()+"/":""}${d.getMonth()+1}/${d.getDate()}`;

  const days=[];for(let i=0;i<=PAST+FUTURE;i++)days.push(dayLabel(new Date(dateBase.getFullYear(),dateBase.getMonth(),dateBase.getDate()+i)));
  const fill=(id,arr)=>{const c=$("#"+id);c.innerHTML=arr.map((x,i)=>`<div class="wi" data-i="${i}">${x}</div>`).join("");
    c.onclick=e=>{const it=e.target.closest(".wi");if(it)c.scrollTo({top:+it.dataset.i*IH,behavior:"smooth"})};
    c.addEventListener("scroll",()=>{if(c.scrollLeft)c.scrollLeft=0;if(!c._raf)c._raf=requestAnimationFrame(()=>{c._raf=0;paintCol(c)});clearTimeout(c._t);c._t=setTimeout(readWheel,110)},{passive:true})};
  fill("wD",days);fill("wAP",["上午","下午"]);fill("wH",Array.from({length:12},(_,i)=>String(i+1)));fill("wM",Array.from({length:60},(_,i)=>pad(i)));

function paintCol(c){const pos=c.scrollTop/IH,its=c.children,lo=Math.max(0,Math.floor(pos)-5),hi=Math.min(its.length-1,Math.ceil(pos)+5);
  for(let i=lo;i<=hi;i++){const off=i-pos,a=Math.max(-80,Math.min(80,off*20));its[i].style.transform=`perspective(320px) rotateX(${-a}deg)`;its[i].style.opacity=Math.max(.18,1-Math.abs(off)*.24);its[i].classList.toggle("on",Math.abs(off)<.5)}}

function evalAmount(s){
  s=String(s).replace(/[，,\s]/g,"").replace(/[×xX]/g,"*").replace(/÷/g,"/");if(!s)return null;if(!/^[\d.+\-*/()]+$/.test(s))return NaN;let i=0;

  const b=+S.settings.budget||0;if(remOn("bud")&&b){const e=totals(monthTx(ym(now))).e;if(e/b>=.9)out.push({key:"b:"+ym(now)+(e>b?":o":""),tone:e>b?"bad":"warn",text:e>b?`本月已超支 $${fmt(e-b)}`:`本月預算已用 ${Math.floor(e/b*100)}%，剩 $${fmt(b-e)}`,act:"看預算",fn:()=>go("budget")})}
  if(remOn("bak")&&!S.sample&&S.tx.length>=10){const last=S.settings.lastBackup,first=Math.min(...S.tx.map(t=>t.ts||Date.parse(t.date)));
    const since=Math.floor((Date.now()-(last||first))/864e5);if(since>=30)out.push({key:"k:"+Math.floor(since/30),tone:"warn",text:last?`已經 ${since} 天沒有備份`:`還沒有備份過資料`,act:"去備份",fn:()=>{S.focusRem=true;S.focusRemSel="#bakCard";prevView="home";go("set")}})}
  return out.filter(r=>!dis[r.key])}
function remindersHTML(){const rs=getReminders();S._rems=rs;if(!rs.length)return"";
  return`<div class="rems">${rs.map((r,i)=>`<div class="rem ${r.tone}"><i aria-hidden="true"></i><span class="rtxt">${r.text}</span>${r.act?`<button type="button" class="ract" data-ra="${i}">${r.act}</button>`:""}<button type="button" class="rx" data-rx="${i}" aria-label="不再顯示這則提醒">${'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>'}</button></div>`).join("")}</div>`}
function bindReminders(v){v.querySelectorAll("[data-ra]").forEach(b=>b.onclick=()=>S._rems[+b.dataset.ra].fn());
  v.querySelectorAll("[data-rx]").forEach(b=>b.onclick=()=>{const r=S._rems[+b.dataset.rx];S.settings.dismissed={...(S.settings.dismissed||{}),[r.key]:1};
    const el=b.closest(".rem");el.classList.add("gone");setTimeout(()=>{lsSave();render()},220)})}
function addCalendarReminder(){
  const tm=(S.settings.remindTime||"21:00").replace(":",""),now=new Date(),start=new Date(now.getFullYear(),now.getMonth(),now.getDate()),ds=ymd(start).replace(/-/g,"");
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,""),url=location.hostname.endsWith("github.io")?location.origin+location.pathname:"https://young1009.github.io/ledger/";
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//RiChangZhangBen//ZH-TW","CALSCALE:GREGORIAN","BEGIN:VEVENT","UID:ledger-daily-"+Date.now()+"@young1009.github.io","DTSTAMP:"+stamp,
    "DTSTART:"+ds+"T"+tm+"00","DURATION:PT5M","RRULE:FREQ=DAILY","SUMMARY:日常帳本｜今天記帳了嗎？","DESCRIPTION:打開主畫面的「日常帳本」記下今天的花費","URL:"+url,
    "BEGIN:VALARM","ACTION:DISPLAY","TRIGGER:PT0M","DESCRIPTION:今天記帳了嗎？","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");

/* ===== shared dialog helpers ===== */
function openDlg(sh,sc){[...sh.children].forEach((c,i)=>c.style.setProperty("--i",i));lockScroll();sh.classList.remove("hide");sc.classList.remove("hide");sh.hidden=false;sc.hidden=false;sh.scrollTop=0;sh.classList.remove("show");void sh.offsetWidth;sh.classList.add("show")}
function closeDlg(sh,sc){if(sh.hidden)return;if(matchMedia("(prefers-reduced-motion:reduce)").matches){sh.hidden=true;sc.hidden=true;unlockScroll();return}
  sh.classList.remove("show");sh.classList.add("hide");sc.classList.add("hide");setTimeout(()=>{sh.hidden=true;sc.hidden=true;sh.classList.remove("hide");sc.classList.remove("hide");unlockScroll()},190)}
function daysIn(m){const[y,mm]=m.split("-").map(Number);return new Date(y,mm,0).getDate()}

/* ===== favourites ===== */
function quickFav(id,btn){const f=(S.settings.favs||[]).find(x=>x.id===id);if(!f)return;
  if(S.sample){toast("範例模式：先清除範例再開始記帳");return}
  const now=new Date(),t={id:uid(),type:f.type,cat:f.cat,acct:f.acct,amount:f.amount,date:ymd(now),note:f.name,ts:now.getTime()};
  if(btn){btn.classList.remove("pop");void btn.offsetWidth;btn.classList.add("pop")}
  putTx(t);toast(`已記下 ${f.name} ${f.type==="inc"?"+":"−"}$${fmt(f.amount)}`,{label:"復原",fn:()=>{delTx(t.id);toast("已復原")}})}

/* ===== recurring ===== */
function runRecurring(){const now=new Date(),cur=ym(now);let n=0;
  for(const r of S.settings.recurring||[]){let m=r.next||cur;
    while(m<=cur){const d=Math.min(r.day,daysIn(m));if(m===cur&&d>now.getDate())break;
      if(!S.tx.some(t=>t.rid===r.id&&t.date.slice(0,7)===m)){const[y,mm]=m.split("-").map(Number);
        S.tx.push({id:uid(),type:r.type,cat:r.cat,acct:r.acct,amount:r.amount,date:m+"-"+pad(d),note:r.name,ts:new Date(y,mm-1,d,9,0).getTime(),rid:r.id});n++}
      m=shiftMonth(m,1)}r.next=m}
  if(n)lsSave();return n}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){const n=runRecurring();if(n){render();toast(`已自動記入 ${n} 筆固定收支`)}}});
function nextDue(r){const now=new Date(),cur=ym(now);let m=r.next||cur;const d=Math.min(r.day,daysIn(m));return`${+m.slice(5)}/${d}`}
const R={editing:null,type:"exp",start:0};
function openRec(r){R.editing=r||null;R.type=r?r.type:"exp";R.start=0;
  $("#recTitle").textContent=r?"編輯固定收支":"新增固定收支";$("#rName").value=r?r.name:"";$("#rAmt").value=r?r.amount:"";
  $("#rDay").value=String(r?r.day:new Date().getDate());$("#rStartF").hidden=!!r;
  $("#recDel").innerHTML=r?`<button type="button" class="linkdel" id="recDelBtn">刪除這個固定收支</button>`:"";
  if(r)$("#recDelBtn").onclick=askRecDel;
  drawRec(r?r.cat:null,r?r.acct:null);openDlg($("#recSheet"),$("#recScrim"));if(!r)setTimeout(()=>$("#rName").focus(),180)}
function drawRec(cat,acct){
  document.querySelectorAll("#recSheet [data-rt]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.rt===R.type));
  document.querySelectorAll("#recSheet [data-s]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.s===R.start));
  $("#rAmtBox").classList.toggle("inc",R.type==="inc");
  const cats=S.settings[R.type],c=cat&&cats.includes(cat)?cat:($("#rCat").value&&cats.includes($("#rCat").value)?$("#rCat").value:cats[0]);
  $("#rCat").innerHTML=cats.map(x=>`<option>${esc(x)}</option>`).join("");$("#rCat").value=c;
  const ac=S.settings.accounts,a=acct&&ac.includes(acct)?acct:($("#rAcct").value&&ac.includes($("#rAcct").value)?$("#rAcct").value:(R.type==="inc"&&ac.includes("銀行")?"銀行":ac[0]));
  $("#rAcct").innerHTML=ac.map(x=>`<option>${esc(x)}</option>`).join("");$("#rAcct").value=a;
  $("#rCatDot").style.background=catColor(R.type,$("#rCat").value);recHint()}
function recHint(){const d=+$("#rDay").value,today=new Date().getDate();
  $("#rHint").textContent=R.start===0?(d<=today?`這個月 ${d} 號已經過了，儲存後會馬上記入一筆。如果這個月已經自己記過，請選「下個月」。`:`這個月 ${d} 號會自動記入第一筆。`):`從下個月 ${d} 號開始自動記帳。`}
function askRecDel(){$("#recDel").innerHTML=`<div class="confirm">確定刪除？已經記入的紀錄會保留。<button type="button" class="btn danger" id="rdYes">刪除</button><button type="button" class="btn" id="rdNo">取消</button></div>`;
  $("#rdNo").onclick=()=>{$("#recDel").innerHTML=`<button type="button" class="linkdel" id="recDelBtn">刪除這個固定收支</button>`;$("#recDelBtn").onclick=askRecDel};
  $("#rdYes").onclick=()=>{S.settings.recurring=(S.settings.recurring||[]).filter(x=>x!==R.editing);saveSettings();closeDlg($("#recSheet"),$("#recScrim"));toast("已刪除固定收支")}}
document.querySelectorAll("#recSheet [data-rt]").forEach(b=>b.onclick=()=>{if(R.type===b.dataset.rt)return;R.type=b.dataset.rt;$("#rCat").value="";drawRec()});
document.querySelectorAll("#recSheet [data-s]").forEach(b=>b.onclick=()=>{R.start=+b.dataset.s;drawRec($("#rCat").value,$("#rAcct").value)});
$("#rCat").onchange=()=>{$("#rCatDot").style.background=catColor(R.type,$("#rCat").value)};$("#rDay").onchange=recHint;
$("#recClose").onclick=()=>closeDlg($("#recSheet"),$("#recScrim"));$("#recScrim").onclick=()=>closeDlg($("#recSheet"),$("#recScrim"));
$("#recSheet").onsubmit=e=>{e.preventDefault();const name=$("#rName").value.trim(),amt=evalAmount($("#rAmt").value);
  if(!name){toast("請輸入名稱");$("#rName").focus();return}if(amt==null||isNaN(amt)||amt<=0){toast("請輸入大於 0 的金額");$("#rAmt").focus();return}
  const base={type:R.type,name,amount:amt,cat:$("#rCat").value,acct:$("#rAcct").value,day:+$("#rDay").value};
  S.settings.recurring=S.settings.recurring||[];let msg;
  if(R.editing){Object.assign(R.editing,base);msg="已更新固定收支，之後的紀錄會用新設定"}
  else{const cur=ym(new Date());S.settings.recurring.push({id:uid(),...base,next:R.start?shiftMonth(cur,1):cur});msg="已新增固定收支"}
  closeDlg($("#recSheet"),$("#recScrim"));
  if(S.sample&&!R.editing){/* keep demo data, just add */}
  const n=runRecurring();saveSettings();toast(n?`${msg}，並記入 ${n} 筆`:msg)};

/* ===== budget ===== */
function budgetRows(m){const lim=S.settings.catBudget||{},by={};
  for(const t of monthTx(m))if(t.type!=="inc")by[t.cat]=(by[t.cat]||0)+(+t.amount||0);
  const cats=[...S.settings.exp];for(const c of Object.keys(by))if(!cats.includes(c))cats.push(c);
  return cats.map(c=>({cat:c,spent:by[c]||0,limit:+lim[c]||0}))}
function level(sp,lim){if(!lim)return"";const r=sp/lim;return r>1?"over":r>=.8?"warn":""}
function renderBudget(){
  const m=ym(new Date()),t=totals(monthTx(m)),b=+S.settings.budget||0,now=new Date(),dim=daysIn(m),dl=dim-now.getDate()+1;
  const rows=budgetRows(m),tp=b?t.e/b:0,timeP=now.getDate()/dim;
  let h=`<div class="card"><div class="card-h"><h2>本月總預算</h2><span>${+m.slice(5)} 月 · 還有 ${dl} 天</span></div>
    <div class="bigrow"><div><span>已花</span><b class="tn">$${fmt(t.e)}</b></div><div class="${b&&t.e>b?"neg":""}"><span>${b&&t.e>b?"超支":"剩餘"}</span><b class="tn">${b?"$"+fmt(Math.abs(b-t.e)):"—"}</b></div><div><span>每天可花</span><b class="tn">${b&&b>t.e?"$"+fmt((b-t.e)/dl):"—"}</b></div></div>
    ${b?`<div class="pbar ${level(t.e,b)}"><div style="width:${Math.min(100,tp*100)}%"></div><i style="left:${timeP*100}%" title="今天"></i></div>`:""}
    <div class="binrow"><label for="sBudget">每月支出上限</label><div class="bin"><span>$</span><input id="sBudget" class="tn" inputmode="numeric" value="${b||""}" placeholder="未設定"></div></div></div>`;
  h+=`<div class="card"><div class="card-h"><h2>分類預算</h2><span>點金額可以修改</span></div><div class="brows">${rows.map(r=>{const lv=level(r.spent,r.limit),p=r.limit?r.spent/r.limit:0;
    return`<div class="brow ${lv}"><span class="qdot sm" style="background:${catColor("exp",r.cat)}">${esc(r.cat.slice(0,1))}</span><div class="bmain"><div class="btop"><b>${esc(r.cat)}</b><span class="tn">${r.limit?`$${fmt(r.spent)} / `:`已花 $${fmt(r.spent)}`}</span><div class="bin sm"><span>$</span><input class="tn" inputmode="numeric" data-cb="${esc(r.cat)}" value="${r.limit||""}" placeholder="未設定" aria-label="${esc(r.cat)} 的每月上限"></div></div>
      ${r.limit?`<div class="pbar thin ${lv}"><div style="width:${Math.min(100,p*100)}%"></div></div><div class="bnote">${p>1?`超支 $${fmt(r.spent-r.limit)}`:`剩 $${fmt(r.limit-r.spent)}${p>=.8?" · 快用完了":""}`}</div>`:""}</div></div>`}).join("")}</div></div>`;
  const rec=S.settings.recurring||[];
  h+=`<div class="card"><div class="card-h"><h2>固定收支</h2><span>每月自動記帳</span></div><div class="recs">${rec.length?rec.map((r,i)=>`<button type="button" class="rec" data-ri="${i}"><span class="qdot sm" style="background:${catColor(r.type,r.cat)}">${esc(r.cat.slice(0,1))}</span><span class="rmain"><b>${esc(r.name)}</b><span>每月 ${r.day} 號 · ${esc(r.cat)} · ${esc(r.acct)} · 下次 ${nextDue(r)}</span></span><span class="amt tn ${r.type==="inc"?"inc":""}">${r.type==="inc"?"+":"−"}$${fmt(r.amount)}</span></button>`).join(""):`<div class="emptyline">房租、手機費、訂閱、薪水這類每月固定的收支，設定一次就會自動記帳。</div>`}</div><button type="button" class="more" id="addRec">＋ 新增固定收支</button></div>`;
  const v=$("#v-budget");v.innerHTML=h;
  $("#sBudget").onchange=e=>{S.settings.budget=Math.max(0,Math.round(+String(e.target.value).replace(/[^\d.]/g,"")||0));saveSettings();toast(S.settings.budget?"總預算已更新":"已取消總預算")};
  v.querySelectorAll("[data-cb]").forEach(inp=>{inp.onchange=()=>{const n=Math.max(0,Math.round(+String(inp.value).replace(/[^\d.]/g,"")||0));S.settings.catBudget=S.settings.catBudget||{};
    if(n)S.settings.catBudget[inp.dataset.cb]=n;else delete S.settings.catBudget[inp.dataset.cb];saveSettings()};inp.onkeydown=e=>{if(e.key==="Enter")inp.blur()}});
  v.querySelectorAll("[data-ri]").forEach(b=>b.onclick=()=>openRec(rec[+b.dataset.ri]));
  $("#addRec").onclick=()=>openRec(null);
}

/* ===== stats ===== */
function kfmt(n){return n>=10000?(n/10000).toFixed(n>=100000?0:1).replace(/\.0$/,"")+"萬":n>=1000?(n/1000).toFixed(1).replace(/\.0$/,"")+"k":String(Math.round(n))}
function trendSVG(months){
  const W=340,H=176,L=8,R=8,T=22,B=26,n=months.length,bw=(W-L-R)/n,max=Math.max(1,...months.map(x=>x.e));
  const avgList=months.filter(x=>x.e>0),avg=avgList.length?avgList.reduce((s,x)=>s+x.e,0)/avgList.length:0,y=v=>T+(H-T-B)*(1-v/max);
  let s=`<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--line)"/>`;
  if(avg)s+=`<line x1="${L}" x2="${W-R}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--muted)" stroke-dasharray="4 4" opacity=".7"/>`;
  months.forEach((x,i)=>{const cx=L+i*bw+bw/2,w=Math.min(34,bw*.56),top=y(x.e),sel=x.sel;
    s+=`<g class="tbar" data-m="${x.m}" style="cursor:pointer"><rect x="${L+i*bw}" y="${T-14}" width="${bw}" height="${H-T+14}" fill="transparent"/>`;
    if(x.e)s+=`<rect x="${cx-w/2}" y="${top}" width="${w}" height="${H-B-top}" rx="7" fill="${sel?"var(--accent)":"var(--surface2)"}" stroke="${sel?"none":"var(--line)"}"/><text x="${cx}" y="${top-6}" text-anchor="middle" font-size="11" font-weight="700" fill="${sel?"var(--accent)":"var(--muted)"}">${kfmt(x.e)}</text>`;
    s+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="12" font-weight="${sel?900:500}" fill="${sel?"var(--ink)":"var(--muted)"}">${+x.m.slice(5)}月</text></g>`});
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="近六個月支出" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">${s}</svg>`}
function renderStats(){
  const m=S.smonth||ym(new Date()),[yy,mm]=m.split("-"),pm=shiftMonth(m,-1),list=monthTx(m),t=totals(list),pt=totals(monthTx(pm));
  const isCur=m===ym(new Date()),days=isCur?new Date().getDate():daysIn(m);
  const months=[];for(let i=5;i>=0;i--){const k=shiftMonth(m,-i);months.push({m:k,e:totals(monthTx(k)).e,sel:k===m})}
  let cmp="";if(pt.e){const d=(t.e-pt.e)/pt.e*100;cmp=`<span class="chg ${d>0?"up":"down"}">${d>0?"▲":"▼"} 比上月${d>0?"多":"少"} ${Math.abs(d).toFixed(0)}%</span>`}
  let h=`<div class="monthbar"><button class="round" id="sPrev" aria-label="上個月">‹</button><h2>${+mm} 月<small>${yy}</small></h2><button class="round" id="sNext" aria-label="下個月"${isCur?" disabled":""}>›</button></div>`;
  h+=`<div class="card"><div class="card-h"><h2>本月概況</h2>${cmp}</div><div class="bigrow"><div><span>支出</span><b class="tn">$${fmt(t.e)}</b></div><div class="inc"><span>收入</span><b class="tn">$${fmt(t.i)}</b></div><div class="${t.n<0?"neg":""}"><span>結餘</span><b class="tn">${money(t.n)}</b></div></div>
    <div class="minis"><div><span>日均支出</span><b class="tn">$${fmt(t.e/days)}</b></div><div><span>上月支出</span><b class="tn">$${fmt(pt.e)}</b></div><div><span>筆數</span><b class="tn">${list.filter(x=>x.type!=="inc").length}</b></div></div></div>`;
  h+=`<div class="card"><div class="card-h"><h2>近 6 個月支出</h2><span class="tn">${(()=>{const a=months.filter(x=>x.e>0);return a.length?"虛線為平均 $"+fmt(a.reduce((s,x)=>s+x.e,0)/a.length):"點長條切換月份"})()}</span></div><div class="trend">${trendSVG(months)}</div></div>`;
  const cur={},prev={};for(const x of list)if(x.type!=="inc")cur[x.cat]=(cur[x.cat]||0)+(+x.amount||0);for(const x of monthTx(pm))if(x.type!=="inc")prev[x.cat]=(prev[x.cat]||0)+(+x.amount||0);
  const rank=Object.entries(cur).sort((a,b)=>b[1]-a[1]),top=rank.length?rank[0][1]:1,lim=S.settings.catBudget||{};
  h+=`<div class="card"><div class="card-h"><h2>分類排行</h2><span>和上月比較</span></div>${rank.length?`<div class="ranks">${rank.map(([c,v],i)=>{const pv=prev[c]||0,d=v-pv;
    return`<div class="rk"><span class="rn tn">${i+1}</span><span class="qdot sm" style="background:${catColor("exp",c)}">${esc(c.slice(0,1))}</span><div class="rmain"><div class="rtop"><b>${esc(c)}</b><span class="tn"><b>$${fmt(v)}</b> · ${(v/t.e*100).toFixed(0)}%</span></div>
      <div class="rbar"><div style="width:${v/top*100}%;background:${catColor("exp",c)}"></div></div><div class="rsub">${pv?`<span class="${d>0?"up":"down"}">${d>0?"▲":"▼"} $${fmt(Math.abs(d))}</span>`:`<span>上月沒有</span>`}${lim[c]?`<span>預算 $${fmt(lim[c])}${v>lim[c]?" · 超支":""}</span>`:""}</div></div></div>`}).join("")}</div>`:`<div class="emptyline">這個月還沒有支出</div>`}</div>`;
  const big=list.filter(x=>x.type!=="inc").sort((a,b)=>b.amount-a.amount).slice(0,3);
  if(big.length)h+=`<div class="card"><div class="card-h"><h2>最大的 ${big.length} 筆支出</h2></div><div class="rows">${big.map(x=>rowHTML(x,true)).join("")}</div></div>`;
  const v=$("#v-stats");v.innerHTML=h;
  $("#sPrev").onclick=()=>{S.smonth=pm;renderStats();animateView("back")};
  $("#sNext").onclick=()=>{if(isCur)return;S.smonth=shiftMonth(m,1);renderStats();animateView("fwd")};
  v.querySelectorAll(".tbar").forEach(g=>g.onclick=()=>{const k=g.dataset.m;if(k===m)return;const dir=k>m?"fwd":"back";S.smonth=k;renderStats();animateView(dir)});
  bindRows(v);
}
$("#closeSheet").onclick=closeSheet;$("#scrim").onclick=closeSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeSheet();closeDlg($("#recSheet"),$("#recScrim"))}});
$("#addBtn").onclick=()=>openSheet({});
let prevView="home";
$("#gear").onclick=()=>{if(S.view==="set")go(prevView);else{prevView=S.view;go("set")}};
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>{if(b.dataset.go==="list")S.month=ym(new Date());if(b.dataset.go==="stats")S.smonth=ym(new Date());go(b.dataset.go)});
init();
if("serviceWorker" in navigator&&location.hostname.endsWith("github.io")){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
})();
